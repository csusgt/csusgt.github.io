// Shared UI components: cards, charts, badges, icons
function Card({ children, style, onClick, hoverable = false }) {
  const { theme } = useTheme();
  const [hovered, setHovered] = React.useState(false);
  return React.createElement('div', {
    style: {
      background: theme.bgCard,
      borderRadius: 10,
      border: `1px solid ${theme.border}`,
      boxShadow: hovered && hoverable ? theme.shadowHover : theme.shadow,
      transition: 'all 0.2s ease',
      transform: hovered && hoverable ? 'translateY(-2px)' : 'none',
      cursor: onClick ? 'pointer' : 'default',
      ...style,
    },
    onClick,
    onMouseEnter: () => setHovered(true),
    onMouseLeave: () => setHovered(false),
  }, children);
}

function Badge({ text, color, bg }) {
  return React.createElement('span', {
    style: { display: 'inline-block', padding: '2px 8px', borderRadius: 12, fontSize: 11, fontWeight: 600, color, background: bg, letterSpacing: 0.3 }
  }, text);
}

function SeverityBadge({ severity }) {
  const { theme } = useTheme();
  const m = { critical: [theme.error, theme.errorBg], high: ['#EA580C', theme.warningBg], medium: [theme.warning, theme.warningBg], low: [theme.info, theme.infoBg] };
  const [c, bg] = m[severity] || m.low;
  return React.createElement(Badge, { text: severity.charAt(0).toUpperCase() + severity.slice(1), color: c, bg });
}

function TrendArrow({ value, size = 14 }) {
  const { theme } = useTheme();
  const isUp = value > 0;
  const color = isUp ? theme.error : theme.success;
  // For costs, up is bad (red), down is good (green)
  return React.createElement('span', { style: { color, fontSize: size, fontWeight: 600, display: 'inline-flex', alignItems: 'center', gap: 2 } },
    React.createElement('span', { style: { transform: isUp ? 'none' : 'rotate(180deg)', display: 'inline-block' } }, '▲'),
    Math.abs(value).toFixed(1) + '%'
  );
}

function MarginTrendArrow({ value, size = 14 }) {
  const { theme } = useTheme();
  const isUp = value > 0;
  const color = isUp ? theme.success : theme.error;
  return React.createElement('span', { style: { color, fontSize: size, fontWeight: 600, display: 'inline-flex', alignItems: 'center', gap: 2 } },
    React.createElement('span', { style: { transform: isUp ? 'none' : 'rotate(180deg)', display: 'inline-block' } }, '▲'),
    (value > 0 ? '+' : '') + value.toFixed(1) + '%'
  );
}

// SVG Area Chart
function AreaChart({ data, width = 280, height = 80, color, gradientId, showLabels = false, showDots = true }) {
  const { theme } = useTheme();
  color = color || theme.primary;
  const gid = gradientId || 'ag-' + Math.random().toString(36).slice(2, 7);
  const min = Math.min(...data.map(d => d.value)) * 0.95;
  const max = Math.max(...data.map(d => d.value)) * 1.02;
  const range = max - min || 1;
  const pad = { top: 8, bottom: showLabels ? 20 : 8, left: 4, right: 4 };
  const w = width - pad.left - pad.right;
  const h = height - pad.top - pad.bottom;
  const pts = data.map((d, i) => ({ x: pad.left + (i / (data.length - 1)) * w, y: pad.top + h - ((d.value - min) / range) * h }));
  const line = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length - 1].x.toFixed(1)},${pad.top + h} L${pts[0].x.toFixed(1)},${pad.top + h} Z`;

  return React.createElement('svg', { width, height, viewBox: `0 0 ${width} ${height}`, style: { display: 'block' } },
    React.createElement('defs', null,
      React.createElement('linearGradient', { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 },
        React.createElement('stop', { offset: '0%', stopColor: color, stopOpacity: 0.3 }),
        React.createElement('stop', { offset: '100%', stopColor: color, stopOpacity: 0.02 })
      )
    ),
    React.createElement('path', { d: area, fill: `url(#${gid})` }),
    React.createElement('path', { d: line, fill: 'none', stroke: color, strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' }),
    showDots && pts.map((p, i) => React.createElement('circle', { key: i, cx: p.x, cy: p.y, r: 3, fill: theme.bgCard, stroke: color, strokeWidth: 2 })),
    showLabels && data.map((d, i) => React.createElement('text', {
      key: 'l' + i, x: pts[i].x, y: height - 4, textAnchor: 'middle', fontSize: 10, fill: theme.textMuted,
      fontFamily: 'Inter, system-ui, sans-serif'
    }, d.month || d.label || ''))
  );
}

// SVG Bar Chart
function BarChart({ data, width = 300, height = 160, colorFn }) {
  const { theme } = useTheme();
  const pad = { top: 8, bottom: 24, left: 40, right: 8 };
  const w = width - pad.left - pad.right;
  const h = height - pad.top - pad.bottom;
  const max = Math.max(...data.map(d => Math.abs(d.value))) * 1.15;
  const barW = Math.min(32, (w / data.length) * 0.6);
  const gap = (w - barW * data.length) / (data.length + 1);

  return React.createElement('svg', { width, height, viewBox: `0 0 ${width} ${height}`, style: { display: 'block' } },
    data.map((d, i) => {
      const x = pad.left + gap + i * (barW + gap);
      const barH = (Math.abs(d.value) / max) * h;
      const y = pad.top + h - barH;
      const color = colorFn ? colorFn(d) : theme.primary;
      return React.createElement('g', { key: i },
        React.createElement('rect', { x, y, width: barW, height: barH, rx: 4, fill: color, opacity: 0.85 }),
        React.createElement('text', { x: x + barW / 2, y: height - 6, textAnchor: 'middle', fontSize: 10, fill: theme.textMuted, fontFamily: 'Inter, system-ui, sans-serif' }, d.label),
        React.createElement('text', { x: x + barW / 2, y: y - 4, textAnchor: 'middle', fontSize: 10, fill: theme.textSecondary, fontFamily: 'Inter, system-ui, sans-serif', fontWeight: 600 }, d.displayValue || d.value.toFixed(1))
      );
    })
  );
}

// Horizontal waterfall-style bar
function WaterfallBar({ items, width = 400, height = 200 }) {
  const { theme } = useTheme();
  const pad = { top: 16, bottom: 8, left: 120, right: 60 };
  const w = width - pad.left - pad.right;
  const h = height - pad.top - pad.bottom;
  const rowH = Math.min(28, h / items.length);
  const maxVal = Math.max(...items.map(d => Math.abs(d.value)));

  return React.createElement('svg', { width, height, viewBox: `0 0 ${width} ${height}`, style: { display: 'block' } },
    items.map((item, i) => {
      const y = pad.top + i * rowH;
      const barW = (Math.abs(item.value) / maxVal) * w;
      const isNeg = item.value < 0;
      const color = isNeg ? theme.error : theme.success;
      return React.createElement('g', { key: i },
        React.createElement('text', { x: pad.left - 8, y: y + rowH / 2 + 4, textAnchor: 'end', fontSize: 12, fill: theme.text, fontFamily: 'Inter, system-ui, sans-serif' }, item.name),
        React.createElement('rect', { x: pad.left, y: y + 4, width: barW, height: rowH - 10, rx: 4, fill: color, opacity: 0.2 }),
        React.createElement('rect', { x: pad.left, y: y + 4, width: barW, height: rowH - 10, rx: 4, fill: color, opacity: 0.7 }),
        React.createElement('text', { x: pad.left + barW + 6, y: y + rowH / 2 + 4, fontSize: 11, fill: color, fontWeight: 600, fontFamily: 'Inter, system-ui, sans-serif' },
          (isNeg ? '' : '+') + item.value.toFixed(1) + '%')
      );
    })
  );
}

// Donut chart
function DonutChart({ segments, size = 120, strokeWidth = 18 }) {
  const { theme } = useTheme();
  const r = (size - strokeWidth) / 2;
  const cx = size / 2, cy = size / 2;
  const circ = 2 * Math.PI * r;
  let offset = 0;
  const total = segments.reduce((s, seg) => s + seg.value, 0);

  return React.createElement('svg', { width: size, height: size, viewBox: `0 0 ${size} ${size}` },
    React.createElement('circle', { cx, cy, r, fill: 'none', stroke: theme.border, strokeWidth }),
    segments.map((seg, i) => {
      const pct = seg.value / total;
      const dash = pct * circ;
      const el = React.createElement('circle', {
        key: i, cx, cy, r, fill: 'none', stroke: seg.color, strokeWidth,
        strokeDasharray: `${dash} ${circ - dash}`,
        strokeDashoffset: -offset,
        strokeLinecap: 'round',
        transform: `rotate(-90 ${cx} ${cy})`,
      });
      offset += dash;
      return el;
    })
  );
}

// Mini sparkline
function Sparkline({ data, width = 60, height = 20, color }) {
  const { theme } = useTheme();
  color = color || theme.primary;
  const min = Math.min(...data);

  const pts = data.map((v, i) => `${(i / (data.length - 1)) * width},${height - ((v - min) / range) * (height - 4) - 2}`).join(' ');
  return React.createElement('svg', { width, height, style: { display: 'inline-block', verticalAlign: 'middle' } },

}
